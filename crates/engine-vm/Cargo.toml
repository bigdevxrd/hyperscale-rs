[package]
name = "hyperscale-engine-vm"
version.workspace = true
edition.workspace = true
description = "VM engine integration: the wave-batch executor over vm-kernel"

[dependencies]
hyperscale-effects-bridge.workspace = true
hyperscale-engine.workspace = true
hyperscale-metrics.workspace = true
hyperscale-storage.workspace = true
hyperscale-types.workspace = true
hyperscale-vm-effects.workspace = true
hyperscale-vm-kernel.workspace = true
hyperscale-vm-stdlib.workspace = true

blake3.workspace = true
indexmap.workspace = true
tracing.workspace = true

radix-common.workspace = true
radix-substate-store-interface.workspace = true

# The blessed engine runs native; the reference interpreter is the
# wasm32 implementation by decision (the in-browser simulation), not a
# fallback. Phase 2's differential guarantee — byte-identical receipts
# and fuel across both runtimes — is what makes the split sound.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyperscale-vm-runtime.workspace = true
wasmtime.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
hyperscale-vm-ref.workspace = true

[lints]
workspace = true
