[package]
name = "hyperscale-engine"
version.workspace = true
edition.workspace = true
description = "Engine integration: the wave-batch execution seam and genesis bootstrap"

[dependencies]
hyperscale-dispatch.workspace = true
hyperscale-storage.workspace = true
hyperscale-types.workspace = true

# External dependencies
arc-swap.workspace = true
dashmap.workspace = true
tracing.workspace = true

# Radix dependencies
radix-common.workspace = true
radix-engine-interface.workspace = true
radix-substate-store-interface.workspace = true

# Genesis bootstrap requires exactly one substate cache backend. Moka reads
# a monotonic clock when it builds the cache, which wasm32 does not provide,
# so that target takes the LRU backend instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
radix-engine = { workspace = true, features = ["moka"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
radix-engine = { workspace = true, features = ["lru"] }

[lints]
workspace = true
